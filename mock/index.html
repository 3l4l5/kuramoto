<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kuramoto オフィス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 俯瞰したオフィスの床(固定座標のステージを幅に合わせて縮尺)+ 右に 1 枚だけ開く引き出し */
:root {
  --design: #B0306E; --design-soft: #FBE4F0;
  --bg: #E9ECEF; --floor: #F1F3F5; --floor-line: #E2E6EA; --surface: #FFFFFF; --ink: #1C232A; --muted: #5A6570;
  --line: #CDD4DA; --table: #FBFBFC; --table-edge: #C3CBD2; --laptop: #A3ADB6; --route: #B6C0C8;
  --dev: #2F67D4; --dev-soft: #E3ECFB; --review: #C95A22; --review-soft: #FBE8DD;
  --lead: #7A45C2; --lead-soft: #EEE5F9; --ok: #17845C; --ok-soft: #DDF2E8;
  --warn: #9A6200; --warn-soft: #FFF0C9; --danger: #B42F2F; --danger-soft: #FBE3E3;
  --shadow: 0 1px 2px rgba(20,30,40,.08), 0 4px 14px rgba(20,30,40,.06);
  --f-display: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
  --f-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161A; --floor: #191E23; --floor-line: #20262C; --surface: #1F252B; --ink: #E7ECF0; --muted: #9AA6B1;
  --line: #333C45; --table: #262D34; --table-edge: #3B454E; --laptop: #59646E; --route: #3E4851;
  --dev: #77A2F2; --dev-soft: #1F2E4A; --review: #F0915E; --review-soft: #45291B;
  --lead: #B58DEB; --lead-soft: #33264A; --ok: #4CC593; --ok-soft: #183A2D;
  --warn: #F2C04D; --warn-soft: #3D3016; --danger: #F07C7C; --danger-soft: #4A2222;
  --design: #F07AB8; --design-soft: #4A1F36;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161A; --floor: #191E23; --floor-line: #20262C; --surface: #1F252B; --ink: #E7ECF0; --muted: #9AA6B1;
  --line: #333C45; --table: #262D34; --table-edge: #3B454E; --laptop: #59646E; --route: #3E4851;
  --dev: #77A2F2; --dev-soft: #1F2E4A; --review: #F0915E; --review-soft: #45291B;
  --lead: #B58DEB; --lead-soft: #33264A; --ok: #4CC593; --ok-soft: #183A2D;
  --warn: #F2C04D; --warn-soft: #3D3016; --danger: #F07C7C; --danger-soft: #4A2222;
  --design: #F07AB8; --design-soft: #4A1F36;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--dev); outline-offset: 2px; }

.app { max-width: 1440px; margin: 0 auto; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--f-display); font-size: 22px; }
.brand span { color: var(--muted); font-size: 12px; }
.ws { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.ws code { font-family: var(--f-mono); font-size: 12px; }
.tabs { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.tabs button { height: 30px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.btn { position: relative; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 13px; }
.btn[aria-expanded="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.btn .badge { position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--lead); color: var(--surface); font-size: 11px; font-weight: 700; display: grid; place-items: center; font-family: var(--f-mono); }

.layout { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.main { flex: 999 1 640px; min-width: 0; }
.drawer { flex: 1 1 360px; min-width: 0; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
@media (max-width: 1000px) { .drawer { max-width: none; } }
.drawer > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.drawer h2 { margin: 0; font-family: var(--f-display); font-size: 16px; }
.x { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font-size: 18px; }

/* オフィス */
.stage-wrap { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: var(--floor); border: 1px solid var(--line); }
.stage { position: absolute; left: 0; top: 0; width: 1240px; height: 700px; transform-origin: 0 0;
  background-image: linear-gradient(var(--floor-line) 1px, transparent 1px), linear-gradient(90deg, var(--floor-line) 1px, transparent 1px); background-size: 40px 40px; }
.abs { position: absolute; }
.routes { position: absolute; left: 0; top: 0; width: 1240px; height: 700px; pointer-events: none; }
.table { position: absolute; height: 82px; border-radius: 14px; background: var(--table); border: 1px solid var(--table-edge); box-shadow: 0 6px 0 -1px var(--table-edge); z-index: 20; }
.floor-label { position: absolute; z-index: 35; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 13px; white-space: nowrap; }
.floor-label .team { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.floor-label .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.hot { background: var(--danger-soft); color: var(--danger); }
.chip.ver { background: var(--bg); color: var(--muted); font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); }
.route-label { position: absolute; z-index: 6; font-size: 11px; color: var(--muted); background: var(--floor); padding: 0 4px; }

.tray { position: absolute; z-index: 30; width: 60px; height: 76px; }
.tray .base { position: absolute; left: 0; bottom: 0; width: 60px; height: 12px; border-radius: 3px; background: var(--muted); opacity: .5; }
.tray .paper { position: absolute; left: 5px; width: 50px; height: 7px; border-radius: 1px; background: var(--surface); border: 1px solid var(--muted); }
.tray .count { position: absolute; right: -12px; bottom: 6px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; color: var(--surface); }

.person { position: absolute; width: 84px; height: 104px; z-index: 10; transition: opacity .5s, transform .5s; }
.person svg { display: block; width: 100%; height: 100%; }
.person.work svg { animation: type 1.1s ease-in-out infinite; }
.person.arrive { animation: arrive .7s cubic-bezier(.2,1.4,.4,1) both; }
.person.leave { opacity: 0; transform: translateY(14px) scale(.8); }
.puff { position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 3px solid currentColor; opacity: 0; pointer-events: none; animation: puff .8s ease-out; }
@keyframes type { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
@keyframes arrive { from { transform: translateY(-30px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes puff { 0% { transform: scale(.3); opacity: .8; } 100% { transform: scale(1.3); opacity: 0; } }

.laptop { position: absolute; z-index: 25; width: 46px; height: 28px; border-radius: 5px 5px 2px 2px; background: var(--laptop); transition: box-shadow .4s, opacity .4s; }
.laptop::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--table); opacity: .7; }
.laptop.on { box-shadow: 0 0 0 3px var(--glow), 0 0 18px 2px var(--glow); }

.tag { position: absolute; z-index: 40; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
.tag .name { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; box-shadow: var(--shadow); }
.tag .name b { font-weight: 700; }
.tag .name .t { font-family: var(--f-mono); font-size: 11px; }
.tag .name .help { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.tag .name .redo { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); }
.tag .bar { width: 56px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.tag .bar i { display: block; height: 100%; border-radius: 2px; }
.tag.idle .name { color: var(--muted); box-shadow: none; }
.zz { font-family: var(--f-display); font-weight: 700; color: var(--muted); animation: zz 2.4s ease-in-out infinite; }
@keyframes zz { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

.bubble { position: absolute; z-index: 60; transform: translateX(-50%); padding: 8px 12px; border-radius: 12px; background: var(--ink); color: var(--surface); font-size: 13.5px; font-weight: 500; line-height: 1.4; white-space: nowrap; box-shadow: var(--shadow); animation: pop .25s ease-out; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
@keyframes pop { from { transform: translateX(-50%) scale(.7); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

.flight { position: absolute; z-index: 80; transition: left 1s cubic-bezier(.45,.05,.55,.95), top 1s cubic-bezier(.45,.05,.55,.95); }
.flight .doc { display: flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 6px; background: var(--surface); border: 1.5px solid var(--c); box-shadow: var(--shadow); font-family: var(--f-mono); font-size: 11px; color: var(--ink); animation: hop 1s ease-in-out; white-space: nowrap; }
.flight .doc i { width: 10px; height: 12px; border-radius: 1px; background: var(--c); opacity: .85; }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }

.shelf { position: absolute; z-index: 20; border-radius: 12px; background: var(--table); border: 1px solid var(--table-edge); box-shadow: 0 6px 0 -1px var(--table-edge); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.shelf .title { font-size: 12px; color: var(--muted); }
.shelf .title b { color: var(--ink); font-family: var(--f-display); font-size: 14px; margin-right: 4px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 6px 5px 8px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; }
.mrow .id { font-family: var(--f-mono); font-size: 11px; }
.mrow button { height: 26px; padding: 0 9px; border-radius: 6px; border: 0; background: var(--ok); color: var(--surface); font-size: 12px; font-weight: 700; }
.mrow.bad { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.outbox { position: absolute; z-index: 20; border-radius: 12px; border: 1px dashed var(--table-edge); padding: 10px 12px; font-size: 12px; color: var(--muted); }
.outbox b { color: var(--ink); font-family: var(--f-display); font-size: 14px; margin-right: 4px; }
.outbox .stack { display: flex; flex-wrap: wrap-reverse; gap: 3px; margin-top: 6px; }
.outbox .stack span { width: 16px; height: 12px; border-radius: 2px; background: var(--ok-soft); border: 1px solid var(--ok); }

.log { position: absolute; z-index: 50; left: 24px; top: 470px; width: 330px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.log h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.log li { font-size: 12.5px; line-height: 1.45; display: grid; grid-template-columns: 40px 1fr; gap: 6px; }
.log li time { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 1px; }
.log li:first-child { font-weight: 500; }

/* ボード */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; gap: 10px; min-width: 980px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 420px; }
.col h3 { margin: 0; display: flex; justify-content: space-between; font-size: 13px; }
.col h3 span { font-family: var(--f-mono); color: var(--muted); font-weight: 500; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.card .id { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.card .who { font-size: 11px; font-weight: 500; }

/* モニタリング */
.mon { padding: 14px; display: flex; flex-direction: column; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--f-mono); font-size: 22px; line-height: 1.3; }
.kpi .n { font-size: 11px; color: var(--muted); }
.mon h3 { margin: 0 0 6px; font-size: 13px; }
.row { display: grid; grid-template-columns: 96px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 5px; }
.row .track { height: 10px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.row .track i { display: block; height: 100%; border-radius: 3px; transition: width .4s; }
.row .num { font-family: var(--f-mono); text-align: right; }
table.vt { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.vt th, table.vt td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
table.vt th { color: var(--muted); font-weight: 500; }

/* 方針 */
.pol { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.pol .seg { display: inline-flex; flex-wrap: wrap; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); align-self: flex-start; }
.pol .seg button { white-space: nowrap; height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 500; font-size: 13px; }
.pol .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.pol label.h { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.pol .hint { font-size: 12px; color: var(--muted); }
.pol textarea { width: 100%; min-height: 150px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; line-height: 1.6; resize: vertical; }
.pol .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.pol .opts label { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; }
.pol .opts input { accent-color: var(--ink); }
.pol .fixed { font-size: 12px; color: var(--muted); padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px dashed var(--line); }
.pol .save { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pol .save button { height: 38px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--ink); color: var(--surface); font-weight: 700; }
.pol .saved { font-size: 12px; color: var(--ok); }
.pol ol.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.pol ol.hist li { display: grid; grid-template-columns: 30px 44px 1fr; gap: 6px; color: var(--muted); }
.pol ol.hist li b { font-family: var(--f-mono); color: var(--ink); font-weight: 500; }

/* リーダーとの会話 */
.chat-list { height: 470px; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; font-size: 13px; line-height: 1.5; }
.msg.lead { align-self: flex-start; }
.msg.lead .who { font-size: 11px; color: var(--lead); font-weight: 700; margin-bottom: 2px; }
.msg.lead .body { background: var(--lead-soft); padding: 8px 11px; border-radius: 4px 12px 12px 12px; }
.msg.lead .body .kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-right: 4px; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--surface); padding: 8px 11px; border-radius: 12px 4px 12px 12px; }
.ask { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.ask .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.ask .acts button { height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }
.ask .acts button.primary { background: var(--lead); border-color: var(--lead); color: var(--surface); }
.ask .acts button.go { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.ask .done { font-size: 12px; color: var(--ok); font-weight: 500; }
.compose { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.compose input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
.compose button { height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--lead); color: var(--surface); font-weight: 700; }
.note { font-size: 11px; color: var(--muted); padding: 0 14px 10px; }
/* あなたの対応 */
.inbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.inbox > header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.inbox h2 { margin: 0; font-family: var(--f-display); font-size: 17px; }
.inbox .cnt { font-family: var(--f-mono); font-size: 13px; padding: 1px 8px; border-radius: 999px; background: var(--ink); color: var(--surface); }
.inbox .sub { font-size: 12px; color: var(--muted); }
.inbox .more { margin-left: auto; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; }
.inbox .empty { font-size: 13px; color: var(--muted); padding: 6px 2px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.item.decide { border-color: var(--warn); background: var(--warn-soft); }
.item.merge { border-color: var(--ok); background: var(--ok-soft); }
.item .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.item .kind { font-weight: 700; font-size: 11px; padding: 1px 7px; border-radius: 5px; color: var(--surface); }
.item.decide .kind { background: var(--warn); }
.item.merge .kind { background: var(--ok); }
.item .where { color: var(--muted); }
.item .due { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--warn); font-weight: 500; }

        const redo = m.role === 'dev' && t.conflict ? '<span class="redo">衝突</span>' : m.role === 'dev' && t.rounds > 0 ? '<span class="redo">直し' + t.rounds + '</span>' : '';
        const roleChip = u.roles.length > 1 ? '<span class="help" style="background:' + R.soft + ';color:' + R.c + '">' + R.name + '</span>' : '';
        n.tag.className = 'tag';
        n.tag.innerHTML = '<span class="name"><b>' + m.look.n + '</b><span class="t">#' + t.id + '</span>' + roleChip + redo + helper + '</span><span class="bar"><i style="width:' + pct + '%;background:' + R.c + '"></i></span>';
      } else if (m.state === 'leave') {
        n.tag.className = 'tag idle'; n.tag.innerHTML = '<span class="name">おつかれさま</span>';
      } else {
        n.tag.className = 'tag idle';
        n.tag.innerHTML = '<span class="name"><b>' + m.look.n + '</b>' + (m.base ? '待機中 <span class="zz">z</span>' : 'free') + helper + '</span>';
      }
    }));
    for (const [id, n] of nodes) if (!alive.has(id)) { n.p.remove(); n.tag.remove(); n.lap.remove(); nodes.delete(id); }

    const landed = (st) => tasks.filter((t) => t.stage === st && !t.worker && T >= t.landAt).length;
    const qs = FORM.units.map((u) => queueOf(u).length);
    FORM.units.forEach((u, i) => {
      const q = qs[i], here = (members[u.id] || []).filter((m) => m.state !== 'leave').length;
      drawTray(deco.trays[u.id], q, unitColor(u));
      const neck = q >= 3 && q === Math.max(...qs) && FORM.units.length > 1;
      const level = neck ? '<span class="chip neck">ボトルネック</span>' : q >= 5 ? '<span class="chip hot">溜まっています</span>' : q >= 3 ? '<span class="chip warn">溜まり気味</span>' : '';
      deco.labels[u.id].innerHTML = '<span class="team" style="color:' + unitColor(u) + '">' + u.name + '</span>'
        + u.roles.map((r) => '<span class="chip" style="background:' + ROLES[r].soft + ';color:' + ROLES[r].c + '">' + ROLES[r].name + '</span>').join('')
        + '<span class="meta">' + here + '/' + u.max + ' 人 · 待ち ' + q + ' 件</span>' + level;
    });
    const asks = landed('ask');
    drawTray(deco.trays.ask, asks, 'var(--lead)');
    const waitingYou = chat.filter((c) => c.ask && !c.answered).length;
    deco.labels.lead.innerHTML = '<span class="team" style="color:var(--lead)">リーダー</span><span class="meta">判断待ち ' + asks + ' 件</span>' + (waitingYou ? '<span class="chip warn">責任者の返事待ち ' + waitingYou + '</span>' : '');
    leadEl.classList.toggle('work', bubbles.some((b) => b.key === 'lead'));
    leadTag.className = 'tag'; leadTag.innerHTML = '<span class="name"><b>マキ</b>リーダー<span class="chip ver" style="height:18px">' + MODELS[POL.lead.model].name + ' · v' + POL.lead.v + '</span></span>';

    const inMerge = tasks.filter((t) => t.stage === 'merge' && T >= t.landAt);
    shelf.innerHTML = '<div class="title"><b>merge 待ち</b>' + inMerge.length + ' 件</div>'
      + inMerge.slice(0, 7).map((t) => t.conflict
        ? '<div class="mrow bad"><span class="id">#' + t.id + '</span><span>衝突</span></div>'
        : '<div class="mrow"><span class="id">#' + t.id + '</span><button type="button" data-merge="' + t.id + '">merge</button></div>').join('')
      + (inMerge.length > 7 ? '<div class="title">ほか ' + (inMerge.length - 7) + ' 件</div>' : '')
      + '<div class="title">押すのは責任者</div>';
    outbox.innerHTML = '<b>merge 済み</b>' + stats.merged + ' 件<div class="stack">' + Array.from({ length: Math.min(stats.merged, 40) }, () => '<span></span>').join('') + '</div>';

    stage.querySelectorAll('.bubble').forEach((b) => b.remove());
    bubbles.forEach((b) => {
      let x, y;
      if (b.key === 'lead') { x = leadPos.x + 42; y = leadPos.y - 66; }
      else if (b.key === 'arch') { x = archPos.x + 42; y = archPos.y - 66; }
      else { const m = allMembers().find((mm) => mm.id === b.key); if (!m) return; const p = personPos(m); x = p.x + 42; y = p.y - 66; }
      const e = element('div', 'bubble'); e.textContent = b.text; place(e, x, y);
    });

    for (let i = flights.length - 1; i >= 0; i--) {
      const f = flights[i];
      if (!f.el) {
        f.el = element('div', 'flight', stage, '<span class="doc"><i></i>' + f.label + '</span>');
        f.el.style.setProperty('--c', f.c); place(f.el, f.from.x, f.from.y);
        requestAnimationFrame(() => requestAnimationFrame(() => place(f.el, f.to.x, f.to.y)));
      }
      if (T - f.born > 1050) { f.el.remove(); flights.splice(i, 1); }
    }

    logBox.innerHTML = '<h3>いまの出来事</h3><ol>' + events.map(() => '<li><time></time><span></span></li>').join('') + '</ol>';
    logBox.querySelectorAll('li').forEach((li, i) => { li.querySelector('time').textContent = events[i].at; li.querySelector('span').textContent = events[i].text; });
  }
  function drawTray(tray, n, color) {

  // ---- 描画: あなたの対応 ----
  let inboxSig = '', inboxAll = false;
  function inboxItems() {
    const all = allMembers();
    const decide = tasks.filter((t) => t.stage === 'ask' && chat.some((c) => c.ask === t.id && !c.answered))
      .sort((a, b) => a.askedAt - b.askedAt)
      .map((t) => ({ kind: 'decide', t, owner: all.find((m) => m.id === t.owner) }));
    const ready = tasks.filter((t) => t.stage === 'merge' && T >= t.landAt && !t.conflict).sort((a, b) => a.rounds - b.rounds);
    const merge = ready.map((t, i) => ({ kind: 'merge', t, order: i + 1, owner: all.find((m) => m.id === t.owner) }));
    return decide.concat(merge);
  }

  // ---- 描画: モニタリング ----
  const kfmt = (v) => v >= 1000 ? Math.round(v / 1000) + 'k' : String(Math.round(v * 10) / 10);
  function lineChart(id, key, fmt, color) {
    const pts = stats.series.filter((d) => d[key] != null);
    const Wc = 380, Hc = 120, L = 34, R = 46, Tp = 18, B = 18;
    if (pts.length < 2) return '<div class="hint" style="font-size:12px;color:var(--muted)">完成が 1 件出るとグラフが出ます</div>';
    const t0 = pts[0].T, t1 = Math.max(pts[pts.length - 1].T, t0 + 1), vmax = Math.max(...pts.map((d) => d[key])) * 1.15 || 1;
    const X = (t) => L + (t - t0) / (t1 - t0) * (Wc - L - R), Y = (v) => Tp + (1 - v / vmax) * (Hc - Tp - B);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.T).toFixed(1) + ' ' + Y(p[key]).toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    const marks = stats.marks.filter((m) => m.T >= t0 && m.T <= t1).map((m) => '<line x1="' + X(m.T) + '" x2="' + X(m.T) + '" y1="' + Tp + '" y2="' + (Hc - B) + '" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/><text x="' + (X(m.T) + 3) + '" y="' + (Tp - 6) + '" font-size="10" fill="var(--muted)">' + m.label + '</text>').join('');
    return '<div class="chart" data-chart="' + id + '"><svg viewBox="0 0 ' + Wc + ' ' + Hc + '" role="img" aria-label="' + id + 'の推移">'
      + '<line x1="' + L + '" x2="' + (Wc - R) + '" y1="' + (Hc - B) + '" y2="' + (Hc - B) + '" stroke="var(--line)"/>'
      + '<line x1="' + L + '" x2="' + (Wc - R) + '" y1="' + Y(vmax / 2) + '" y2="' + Y(vmax / 2) + '" stroke="var(--line)" stroke-dasharray="2 4"/>'
      + '<text x="' + (L - 4) + '" y="' + (Y(vmax / 2) + 3) + '" font-size="10" fill="var(--muted)" text-anchor="end">' + fmt(vmax / 2) + '</text>'
      + '<text x="' + (L - 4) + '" y="' + (Hc - B + 3) + '" font-size="10" fill="var(--muted)" text-anchor="end">0</text>'
      + marks + '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round"/>'
      + '<circle cx="' + X(last.T) + '" cy="' + Y(last[key]) + '" r="4" fill="' + color + '" stroke="var(--surface)" stroke-width="2"/>'
      + '<text x="' + (X(last.T) + 8) + '" y="' + (Y(last[key]) + 4) + '" font-size="11" fill="var(--ink)" font-family="IBM Plex Mono, monospace">' + fmt(last[key]) + '</text>'
      + '<rect x="' + L + '" y="0" width="' + (Wc - L - R) + '" height="' + Hc + '" fill="transparent" data-hit="' + id + '"/>'
      + '</svg><span class="tip" hidden></span></div>';
  }
  let chartSig = '';
  function renderMon() {
    const q = (st) => tasks.filter((t) => t.stage === st).length;

      + '<div class="kpi"><div class="l">完成</div><div class="v">' + stats.done + '</div><div class="n">直近 1 分 ' + thru + ' 件</div></div>'

      + '<div class="kpi"><div class="l">再発</div><div class="v">' + stats.recur + '</div><div class="n">直した指摘がまた出た</div></div>'

      + '</div><div><h3>レビュー方針の版ごとの結果</h3><table class="vt"><thead><tr><th>版</th><th>厳しさ</th><th>レビュー</th><th>指摘あり</th></tr></thead><tbody>'
      + (vers.length ? vers.map((v) => { const r = stats.byVer[v], h = POL.review.hist.find((x) => x.v === Number(v)); return '<tr><td>v' + v + '</td><td>' + (h && h.strict != null ? STRICT[h.strict] : STRICT[1]) + '</td><td>' + r.n + '</td><td>' + Math.round(r.found / r.n * 100) + '%</td></tr>'; }).join('') : '<tr><td colspan="4">まだレビューがありません</td></tr>')
      + '</tbody></table></div>';
  }
  function bottleneck() {
    const q = {}; activeStages().forEach((r) => { q[r] = tasks.filter((t) => t.stage === r && !t.worker).length; }); q.ask = tasks.filter((t) => t.stage === 'ask').length;

  const flowOf = (f) => f && f.lead ? Math.round(f.active / f.lead * 100) : null;
  function formTable() {

    return '<div><h3>編成の版ごとの比較</h3><div style="overflow-x:auto"><table class="vt"><thead><tr><th>版</th><th>編成</th><th>完成</th><th>リードタイム</th><th>フロー効率</th><th>tok / 完成</th><th>判断 / 完成</th><th>手戻り</th></tr></thead><tbody>'
      + vs.map((v) => { const f = stats.byForm[v]; return '<tr' + (v === FORM.v ? ' style="font-weight:700"' : '') + '><td>v' + v + '</td><td style="min-width:200px">' + f.label + '</td><td>' + f.done + '</td><td>' + (f.done ? Math.round(f.lead / f.done / 1000) + ' 秒' : '—') + '</td><td>' + (flowOf(f) == null ? '—' : flowOf(f) + '%') + '</td><td>' + (f.done ? kfmt(f.tok / f.done) : '—') + '</td><td>' + (f.done ? (f.asks / f.done).toFixed(2) : '—') + '</td><td>' + (f.allMs ? Math.round(f.redoMs / f.allMs * 100) + '%' : '—') + '</td></tr>'; }).join('')
      + '</tbody></table></div><div class="hint" style="font-size:12px;color:var(--muted);margin-top:4px">フロー効率 = 作業された時間 ÷ 着手から完成までの時間。待ちが減るほど上がる</div></div>';
  }
  document.getElementById('mon').addEventListener('mousemove', (e) => {
    const hit = e.target.closest('[data-hit]'); const box = e.target.closest('.chart'); if (!box) return;
    const tip = box.querySelector('.tip'); if (!hit) { tip.hidden = true; return; }
    const key = box.dataset.chart === 'トークン' ? 'tpc' : 'apc', pts = stats.series.filter((d) => d[key] != null); if (pts.length < 2) return;
    const r = box.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;

          if (i >= 0) pj.req.sec.build[i] = (no ? '作らない|' + f + ' の「変更」 — キャンセルと予約し直しで代える' : '作る|' + f + ' — 変更の口を足す');
          if (no) { pj.dropWhenAsked = '予約の変更は'; }
        };
      } else build.push('作る|' + f);
    });
    const api = (pj.repos.find((r) => r.role === 'API') || pj.repos[0]).r;
    const web = (pj.repos.find((r) => r.role === 'フロント') || pj.repos[0]).r;
    const domain = ['用語: 枠 = 店舗が予約を受け付ける時間帯。定員を持つ', '用語: 予約 = 会員が枠を 1 つ押さえたもの', '集約: 予約。会員と枠は参照するだけ(枠の定員は枠の集約が守る)',
      'ルール: 1 つの枠の確定した予約数は定員を超えない', 'ルール: 会員は同じ枠を 2 回予約できない',
      '状態: 予約 = 確定 → キャンセル(仮押さえを持つかは未決)', '境界: 予約と枠は ' + api + (web !== api ? '、画面の入力途中の状態は ' + web : '') + ' が持つ'];
    const mq = '予約に「仮押さえ」(決済や確認の間だけ枠を押さえる状態)を持つか(持たない / 持つ)';
    qs.push(mq);
    pj.archQ[mq] = (ans) => { const i = pj.req.sec.domain.findIndex((x) => x.startsWith('状態: 予約')); if (i >= 0) pj.req.sec.domain[i] = /持たない/.test(ans) ? '状態: 予約 = 確定 → キャンセル' : '状態: 予約 = 仮押さえ(10 分で自動解除)→ 確定 → キャンセル'; if (!/持たない/.test(ans)) pj.req.sec.data.push('reservations: status に held を追加、held_until 列を追加'); };
    pj.req.sec.domain.push(...domain); pj.fresh = (pj.fresh || []).concat(domain);
    data.push('slots(新規): id, store_id, starts_at, capacity', 'reservations(新規): id, member_id, slot_id, status, created_at', 'members(既存): 変更なし');
    const dq = '予約を新しい表(reservations)で持つか、既存の注文の表に載せるか(新しい表にする / 注文の表に載せる)';
    qs.push(dq);
    pj.archQ[dq] = (ans) => { if (/注文/.test(ans)) { pj.req.sec.data = pj.req.sec.data.filter((x) => !x.startsWith('reservations')); pj.req.sec.data.push('orders(既存): kind 列を追加して予約も載せる(戻しにくい)'); } };

      SG.chats[SG.stage].push({ who: 'me', text }, { who, text: '受け取りました。この段階の版に反映するか検討して、変えるときは差分を見せます(モックの応答です)。' });
      renderStudio();
    }
  });
  // 既にあるコメントは時間差で対応済みにする(デザイナーが直した想定)
  setTimeout(() => { SG.screens.confirm.pins[0].done = true; SG.gates.screen.v = 2; SG.chats.screen.push({ who: 'design', text: '「予約の確認」に、確定ボタンの下へキャンセルの期限を足して v2 にしました。' }); if (ctx === 'studio') renderStudio(); }, 15000);

  let last = performance.now();
  function frame() {
    const now = performance.now(), dt = Math.min(500, now - last); last = now;
    step(dt);
    if (ctx === 'project') { if (view === 'office') renderOffice(); else renderBoard(); }
    if (ctx === 'home' && Math.round(T / 250) % 4 === 0) renderHome();
    if (!document.getElementById('drawer-mon').hidden) renderMon();
    if (!document.getElementById('drawer-pol').hidden && polTab === 'rules') document.querySelectorAll('[data-rcount]').forEach((e) => { const r = RULES[e.dataset.rcount]; e.textContent = '違反 ' + r.hits + ' 件 · 自動で直した ' + r.fixed + ' 件'; });
    if (!document.getElementById('drawer-form').hidden && Math.round(T / 250) % 8 === 0) { const ft = document.getElementById('form-table'); if (ft) ft.innerHTML = formTable(); }
    if (T - lastSample >= 5000) { lastSample = T; stats.series.push({ T, tpc: stats.done ? stats.simTok / stats.done : null, apc: stats.done ? stats.simAsks / stats.done : null }); if (stats.series.length > 120) stats.series.shift(); }
    const fe = flowOf(formStat());
    document.getElementById('eff').innerHTML = (fe == null ? '' : 'フロー効率 <b>' + fe + '%</b> · ') + (stats.done ? '1 件 <b>' + kfmt(stats.simTok / stats.done) + '</b> tok · 判断 <b>' + (stats.simAsks / stats.done).toFixed(2) + '</b>' : '効率: 計測中');
    renderInbox();
    status();
  }
  let lastSample = 0;
  try { if (localStorage.getItem('kuramoto-view') === 'board') setView('board'); } catch (e) {}
  fit(); renderOffice(); renderChat(); renderInbox(); status(); setCtx('home');
  setInterval(frame, 250);
})();
</script>
