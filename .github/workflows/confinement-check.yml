# 閉じ込めの実機の確かめ(docs/e2e-logs/README.md の (a)〜(e))と e2e/auth.spec.ts を、macOS のランナー(sandbox-exec と Chrome がある)で流す(#114)。
# 各手順の出力は、README のファイル名どおり(<日付>-env / a-confined / b-break / c-no-browser-server / d-denied-ports / d-team-ci-test / e-mysql-rounds の .log)に残し、
# artifact「e2e-logs」に上げる。どれか 1 つでも期待どおりでなければ、ジョブを落とす。責任者の手で流す手順は無い。手動でも流せる(workflow_dispatch)。
# 読み方・照合の手順: docs/e2e-logs/README.md。
name: confinement-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/confinement-check.yml"
      - "e2e/**"
      - "playwright.config.ts"
      - "scripts/check-*"
      - "scripts/ci-confinement-lib.sh"
      - "scripts/e2e-count*"
      - "scripts/run-tests*"
      - "src/project/confine*"
      - "src/project/team-ci*"
      - "src/project/confined-browser*"
      - "src/project/local-ports*"
      - "src/server.ts"
      - "ui/src/App.tsx"
      - "ui/src/SessionPanel.tsx"
      - "ui/src/api.ts"
      - "src/access-token*"
      - "src/sessions*"

permissions:
  contents: read

concurrency:
  group: confinement-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # env・(a)〜(d)。MySQL は立てず、(a)〜(c) の npm test は MySQL の回を飛ばす(MySQL の有無・MySQL の既存の不具合に引きずられないように。MySQL の回は (e) のジョブだけ)。continue-on-error なし(例外: (a) のステップだけ、#118 が直るまで continue-on-error: true)
  confinement:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      KURAMOTO_SKIP_MYSQL_TESTS: "1"
      # ブラウザサーバーの標準エラー(Chrome の落ちた理由)を、ログに残す(src/project/confined-browser.ts)
      KURAMOTO_E2E_BROWSER_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      # ランナーには Google Chrome はあるが、Playwright のブラウザ(chromium・headless shell)は入っていない。
      # ブラウザ専用の狭い閉じ込めの中のブラウザサーバーが、Chrome を起動できないときの代わり(Playwright の Chromium)に要る
      - run: npx playwright install chromium
        timeout-minutes: 10

      - name: 準備(ログの置き場所と日付・ホームのダミー)
        run: |
          # ログの置き場所 L。リポジトリの外に置く(作業ツリーに出ると、(b) の「壊したあとに差分が無い」の確かめが崩れる)。
          # ジョブの env では runner コンテキストが使えないので、ステップの中で $RUNNER_TEMP から作って、以後のステップに渡す
          echo "L=$RUNNER_TEMP/e2e-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          echo "D=$(date +%F)" >> "$GITHUB_ENV"
          # (a) (iii) の「~/.kuramoto・~/.ssh へのシンボリックリンク経由の読み取りが断られる」確かめに、読めてはいけないファイルを置く(ランナーはまっさらなので、ダミーを作る)
          mkdir -p ~/.kuramoto ~/.ssh
          chmod 700 ~/.ssh
          echo "dummy-access-token-$(openssl rand -hex 16)" > ~/.kuramoto/access-token
          echo "dummy-ssh-key-$(openssl rand -hex 16)" > ~/.ssh/id_dummy
          chmod 600 ~/.kuramoto/access-token ~/.ssh/id_dummy

      - name: 環境(env)
        run: |
          { date; git rev-parse HEAD; git log -1 --format=%s; sw_vers; uname -a; node -v
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
            npx playwright --version
            ls e2e/*.spec.ts; } 2>&1 | tee "$L/$D-env.log"
          . scripts/ci-confinement-lib.sh
          need "$L/$D-env.log" 'Google Chrome'
          need "$L/$D-env.log" 'e2e/auth\.spec\.ts'
          finish

      - name: (a) 設定あり (i)(iii) - 閉じ込めの中のブラウザ E2E と、シンボリックリンク経由の読み取りの断り
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        # #118「閉じ込めの中のブラウザ E2E(a)を緑にする」が直るまでの間だけ continue-on-error: true(docs/e2e.md の (a) の節)。
        # 判定(下の need / forbid / need_code)はゆるめていない。落ちれば ::error:: の注釈と a-confined.log は今までどおり出る。直したらこの 1 行を外す
        continue-on-error: true
        run: |
          . scripts/ci-confinement-lib.sh
          set +e
          npx tsx scripts/check-confined-browser.ts . 2>&1 | tee "$L/$D-a-confined.log"
          rc=${PIPESTATUS[0]}
          set -e
          need_code "(a) check-confined-browser" "$rc"
          # e2e/auth.spec.ts(#110 後の 401 の流れ)。check-confined-browser.ts は npm test の出力の最後の 60 行だけを出すので、auth.spec.ts の行が切れることがある。
          # 閉じ込めの外のランナーで、auth.spec.ts だけを直に流した出力を、見出しを付けてこのログの末尾に足す(上の出力は書き換えない)
          set +e
          { npx vite build && npx playwright test e2e/auth.spec.ts --reporter=list; } > "$RUNNER_TEMP/auth.out" 2>&1
          auth_rc=$?
          set -e
          { echo; echo "--- e2e/auth.spec.ts を、閉じ込めの外で直に流した出力(playwright test e2e/auth.spec.ts)。終了コード: $auth_rc"; cat "$RUNNER_TEMP/auth.out"; } | tee -a "$L/$D-a-confined.log"
          need_code "(a) e2e/auth.spec.ts" "$auth_rc"
          [ "$(grep -c '✓.*auth\.spec\.ts' "$RUNNER_TEMP/auth.out")" -ge 4 ] || add_reason "auth.spec.ts の ✓ が 4 本無い"
          need "$L/$D-a-confined.log" '^--- npm test の終了コード: 0'
          need "$L/$D-a-confined.log" '^○ E2E [0-9]+ 件が通った'
          need "$L/$D-a-confined.log" '^○ 接続した側からの攻撃は、どれも失敗した'
          need "$L/$D-a-confined.log" 'node_modules 内のシンボリックリンク経由で ~/\.kuramoto'
          need "$L/$D-a-confined.log" 'node_modules 内のシンボリックリンク経由で ~/\.ssh'
          forbid "$L/$D-a-confined.log" '^✗'
          forbid "$L/$D-a-confined.log" '^△'
          forbid "$L/$D-a-confined.log" '^--- (確かめられなかった|接続した側の確かめが動かなかった|playwright test --list が失敗した)'
          [ "$fail" = 0 ] || show_reasons "$L/$D-a-confined.log"
          finish

      - name: (b) 設定あり (ii) - 入口をわざと壊すと落ちる
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          . scripts/ci-confinement-lib.sh
          set +e
          npx tsx scripts/check-confined-browser.ts . --break 2>&1 | tee "$L/$D-b-break.log"
          rc=${PIPESTATUS[0]}
          set -e
          need_code "(b) check-confined-browser --break" "$rc"
          # 終わったら PhoneBar.tsx は元に戻る(差分が無いことを見る)
          { echo "--- git status --short(空なら元に戻っている)"; git status --short; } 2>&1 | tee -a "$L/$D-b-break.log"
          [ -z "$(git status --short)" ] || { git checkout ui/src/PhoneBar.tsx; add_reason "壊したまま戻っていない"; }
          need "$L/$D-b-break.log" '^○ 入口を壊すと落ちた'
          forbid "$L/$D-b-break.log" '^(✗|---) (入口を壊したのに通った|確かめられなかった)'
          [ "$fail" = 0 ] || show_reasons "$L/$D-b-break.log"
          finish

      - name: (c) 設定なし(今の既定の振る舞い)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          . scripts/ci-confinement-lib.sh
          set +e
          npx tsx scripts/check-confined-browser.ts . --no-browser-server 2>&1 | tee "$L/$D-c-no-browser-server.log"
          rc=${PIPESTATUS[0]}
          set -e
          need_code "(c) check-confined-browser --no-browser-server" "$rc"
          # 起動できて E2E が流れた(○)か、起動できず知らせて通った(△)。どちらも既定の振る舞いのとおり。? は流れたか分からないので落とす
          need "$L/$D-c-no-browser-server.log" '^(○|△) 設定なし:'
          need "$L/$D-c-no-browser-server.log" '^--- npm test の終了コード: 0'
          finish

      - name: (d) 断るポートが BLOCKED、ほかのポートは REACHED
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          . scripts/ci-confinement-lib.sh
          # Kuramoto 自身の MySQL(127.0.0.1:3306)の代わりに、3306 で待ち受けるものを立てて、--denied-port 3306 が BLOCKED になることを見る(立っていないと見ない)。
          # mysql-test の 3307 も、届くか(REACHED)を見るだけなので、待ち受けるだけのプロセスで足りる(本物の MySQL は (e) のジョブだけで立てる)
          node -e "for (const p of [3306, 3307]) require('net').createServer((c) => c.end()).listen(p, '127.0.0.1')" &
          listener=$!
          sleep 2
          set +e
          npx tsx scripts/check-denied-ports.ts --denied-port 3306 2>&1 | tee "$L/$D-d-denied-ports.log"
          rc=${PIPESTATUS[0]}
          npx vitest run src/project/team-ci.test.ts --reporter=verbose 2>&1 | tee "$L/$D-d-team-ci-test.log"
          vrc=${PIPESTATUS[0]}
          set -e
          kill "$listener" || true
          need_code "(d) check-denied-ports" "$rc"
          need_code "(d) team-ci.test.ts" "$vrc"
          f="$L/$D-d-denied-ports.log"
          need "$f" '^○ 断るポート\(127\.0\.0\.1:[0-9]+\): BLOCKED'
          need "$f" '^○ ほかのポート.*REACHED'
          need "$f" '^○ mysql-test\(127\.0\.0\.1:3307\): REACHED'
          need "$f" '^○ 断るポート\(--denied-port。Kuramoto 自身が使っているもの\)\(127\.0\.0\.1:3306\): BLOCKED'
          need "$f" '^○ 対照: .*REACHED'
          need "$f" '^○ 断るポートだけが BLOCKED になった'
          forbid "$f" '^(✗|\?|- )'
          t="$L/$D-d-team-ci-test.log"
          need "$t" '✓.*localhost を許していても、断るポート'
          forbid "$t" '(↓|skipped).*断るポート'
          finish

      - name: ログ(env・a〜d)を artifact に上げる
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-a-d
          path: ${{ runner.temp }}/e2e-logs/*.log
          if-no-files-found: error
          retention-days: 30

  # (e) MySQL の回。macOS のランナーで brew の mysql を 3307 に立てて流す(理由は docs/e2e.md)。
  # continue-on-error なし(MySQL の回が落ちたら、このジョブを落とす)。e-mysql-rounds.log は、赤でもそのまま出して artifact に入れる。
  mysql:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # mysql-test(compose.yaml)と同じ接続先。macOS のランナーには docker が無いので、brew の mysql を 3307 で立てる
      KURAMOTO_MYSQL_TEST_URL: mysql://kuramoto_test:kuramoto-test@127.0.0.1:3307/kuramoto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 準備(ログの置き場所と日付)
        run: |
          echo "L=$RUNNER_TEMP/e2e-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          echo "D=$(date +%F)" >> "$GITHUB_ENV"

      # MySQL(e): compose.yaml の mysql-test と同じ設定(127.0.0.1:3307・utf8mb4_bin・UTC・テスト専用の資格情報)で立てる。
      # macOS のランナー(Apple シリコン)には docker(Docker Desktop・colima)が入っていないので、docker compose の代わりに brew の mysql@8.4 を使う。
      - name: MySQL(127.0.0.1:3307)を立てる
        run: |
          brew install mysql@8.4
          BIN="$(brew --prefix mysql@8.4)/bin"
          DATA="$RUNNER_TEMP/mysql-data"
          "$BIN/mysqld" --initialize-insecure --datadir="$DATA"
          nohup "$BIN/mysqld" --datadir="$DATA" --port=3307 --bind-address=127.0.0.1 --mysqlx=OFF \
            --socket="$RUNNER_TEMP/mysql.sock" --pid-file="$RUNNER_TEMP/mysql.pid" \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --default-time-zone=+00:00 --skip-log-bin \
            > "$RUNNER_TEMP/mysqld.log" 2>&1 &
          for i in $(seq 1 60); do
            "$BIN/mysqladmin" -h 127.0.0.1 -P 3307 -u root ping --silent && break
            sleep 2
          done
          "$BIN/mysqladmin" -h 127.0.0.1 -P 3307 -u root ping || { cat "$RUNNER_TEMP/mysqld.log"; exit 1; }
          "$BIN/mysql" -h 127.0.0.1 -P 3307 -u root <<'SQL'
          ALTER USER 'root'@'localhost' IDENTIFIED BY 'kuramoto-test-root';
          CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'kuramoto-test-root';
          GRANT ALL ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
          CREATE DATABASE IF NOT EXISTS kuramoto_test;
          CREATE USER IF NOT EXISTS 'kuramoto_test'@'%' IDENTIFIED BY 'kuramoto-test';
          GRANT ALL ON kuramoto_test.* TO 'kuramoto_test'@'%';
          SQL

      - name: (e) MySQL の回(mysql-test に届いて通る)
        env:
          # vitest の出力に色の制御文字(ESC[...m)が混ざると、「Tests  N passed」の行を判定で読めない。色を付けない
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          . scripts/ci-confinement-lib.sh
          # E2E の回を飛ばした npm test(SQLite の回 → MySQL の回)を、閉じ込めの外で全文流して、MySQL の回の出力を残す。
          # (a)〜(c) は MySQL の回を飛ばしている(MySQL を立てていない)ので、そのログからの抜き出しではなく、ここで直に流す
          set +e
          KURAMOTO_SKIP_E2E_TESTS=1 npm test 2>&1 | tee "$RUNNER_TEMP/npm-test-mysql.out"
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "--- E2E の回を飛ばした npm test(閉じ込めの外・全文)の MySQL の回。終了コード: $rc"
            sed -n '/^=== MySQL の回/,$p' "$RUNNER_TEMP/npm-test-mysql.out"
          } 2>&1 | tee "$L/$D-e-mysql-rounds.log"
          # vitest の要約の行を、注釈に残す(判定が読めなかったとき、色・書式の違いかどうかが、ログを開かずに分かる)
          echo "::notice title=(e) vitest の要約::$(grep -a -E '(Test Files|Tests) ' "$L/$D-e-mysql-rounds.log" | cat -v | tr '\n' '|')"
          need_code "(e) npm test" "$rc"
          need "$L/$D-e-mysql-rounds.log" '^=== MySQL の回\(mysql-test の使い捨ての database'
          forbid "$L/$D-e-mysql-rounds.log" '(飛ばしました\(KURAMOTO_SKIP_MYSQL_TESTS|mysql-test\(127\.0\.0\.1:3307\)に繋がりません)'
          need "$L/$D-e-mysql-rounds.log" 'Tests +[0-9]+ passed'
          forbid "$L/$D-e-mysql-rounds.log" '^✗ 落ちた回'
          finish

      - name: ログ(e)を artifact に上げる
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-e
          path: ${{ runner.temp }}/e2e-logs/*.log
          if-no-files-found: error
          retention-days: 30

  # ログ 7 本を 1 つの artifact(e2e-logs)にまとめる。#112・#115 は、この artifact を取る。
  logs:
    needs: [confinement, mysql]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-logs-*
          merge-multiple: true
          path: e2e-logs
      - name: ログ 7 本が揃っているか
        env:
          CONFINEMENT: ${{ needs.confinement.result }}
          MYSQL: ${{ needs.mysql.result }}
        run: |
          missing=0
          for n in env a-confined b-break c-no-browser-server d-denied-ports d-team-ci-test e-mysql-rounds; do
            ls e2e-logs/*-"$n".log > /dev/null 2>&1 || { echo "::error::*-$n.log が無い(その手順の前で止まった)"; missing=1; }
          done
          # API の上限で artifact の中身を見られないときのために、ジョブのログに残す
          ls -l e2e-logs
          {
            echo "### 閉じ込めの確かめのログ(artifact: e2e-logs)"
            echo
            echo "- env・(a)〜(d): $CONFINEMENT / mysql ジョブ: $MYSQL"
            echo
            echo "| ログ | 行数 |"
            echo "|---|---|"
            for f in e2e-logs/*.log; do echo "| \`$(basename "$f")\` | $(wc -l < "$f" | tr -d ' ') |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          exit $missing
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs/*.log
          if-no-files-found: error
          retention-days: 30
